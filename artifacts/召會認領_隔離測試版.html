<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'none'">
<title>召會認領｜隔離測試版</title>
<style>
:root{--A:#E0533D;--B:#2B6CB0;--C:#E8A317;--D:#6B7A8F;--P:#6B4C7A;--g:#06c755;--dk:#1F6F5C;--ink:#222}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;background:#f4f5f7;color:var(--ink);padding-bottom:108px}
.banner{position:sticky;top:0;z-index:80;background:#9A3412;color:#fff;text-align:center;font-weight:800;line-height:1.45;padding:12px 14px;font-size:17px;letter-spacing:.01em}
header{background:#fff;box-shadow:0 1px 4px #0002}
.top{padding:12px 14px 6px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
.subnote{padding:0 14px 8px;color:#555;font-size:14px;line-height:1.5}
.roles,.seg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.roles button,.seg button{flex:1 1 30%;border:0;background:#eef0f3;border-radius:10px;padding:10px 6px;font-size:15px;font-weight:700;color:#444}
.roles button.on,.seg button.on{background:var(--dk);color:#fff}
.tabs{display:flex;overflow-x:auto}
.tabs button{flex:1;min-width:4.8em;border:0;padding:12px 2px;font-size:15px;font-weight:800;color:#fff;opacity:.5}
.tabs button.on{opacity:1}
.tA{background:var(--A)}.tB{background:var(--B)}.tC{background:var(--C)}.tD{background:var(--D)}.tP{background:var(--P)}
.filters{display:flex;gap:8px;padding:8px 12px}
.filters input,.filters select,textarea,input[type=date],input[type=text]{font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px;font-family:inherit;width:100%}
.filters input,.filters select{flex:1}
.card,.vcard,.panel{background:#fff;margin:10px 12px;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001}
.card{display:flex;gap:12px;align-items:flex-start}
.card.taken{opacity:.48}.card.mine{border-left:6px solid #3a9d5d}
.card input{width:28px;height:28px;flex:none;margin-top:4px}
.n{font-size:20px;font-weight:800}.m{color:#555;font-size:15px;margin-top:4px;line-height:1.45}.by{font-size:15px;margin-top:4px}
.toast{margin:10px 12px;padding:12px 14px;border-radius:12px;background:#E8F5EC;color:#1B5E20;font-weight:700}
.toast.bad{background:#FDECEA;color:#9B1C1C}
.banner2{margin:10px 12px;padding:12px 14px;border-radius:12px;background:#E8EEF8;color:#1F3A5F;line-height:1.5}
.warn{margin:10px 12px;padding:12px 14px;border-radius:12px;background:#FFF4DC;color:#7A4E00;line-height:1.55}
.howto{margin:10px 12px;background:#fff;border-radius:12px;padding:12px 14px;border:2px solid #9A3412}
.howto summary{font-size:18px;font-weight:800;cursor:pointer}
.howto ol{margin:0;padding-left:1.2em}
.howto li{margin:6px 0;line-height:1.45}
.split{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:800px){.split{grid-template-columns:1fr 1fr}}
.sum{display:flex;gap:8px;padding:0 12px}
.sum div{flex:1;border-radius:12px;padding:10px 6px;text-align:center;color:#fff;font-weight:800}
.sum b{display:block;font-size:26px}.sum span{font-size:13px}
.s1{background:#C62828}.s2{background:#E8A317}.s3{background:#3a9d5d}
.vcard{display:flex;gap:12px;align-items:center;border-left:6px solid #3a9d5d}
.vcard.over{border-left-color:#C62828}.vcard.due{border-left-color:#E8A317}.vcard.pending{border-left-color:var(--P)}
.tier{flex:none;width:36px;height:36px;border-radius:8px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.pill{margin-left:auto;padding:6px 10px;border-radius:16px;font-size:14px;font-weight:800;white-space:nowrap}
.p-over{background:#FDECEA;color:#C62828}.p-due{background:#FFF4DC;color:#8A5A00}.p-ok{background:#E8F5EC;color:#2E7D46}.p-pending{background:#F3EEF8;color:#6B4C7A}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:9px 14px;font-size:16px}
.chips button.on{background:var(--dk);color:#fff;border-color:var(--dk);font-weight:800}
.row{display:flex;gap:10px;margin-top:12px}
.row button,footer button,.primary,.ghost{font-size:18px;font-weight:800;border:0;border-radius:10px;padding:12px 14px}
.primary{background:var(--g);color:#fff;width:100%}
.ghost{background:#eee;color:#222}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -1px 4px #0002;z-index:25}
.mask{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:22px}
.h{padding:8px 0;border-bottom:1px dashed #eee;font-size:15px}
.sample{border-left:6px solid var(--dk)}
.countline{font-weight:800;margin-bottom:6px}
.limits{font-size:15px;color:#444;line-height:1.55}
.limits strong{color:#9A3412}
.empty{padding:20px 16px;text-align:center;color:#555}
</style>
</head>
<body>
<div class="banner">隔離測試版｜全部為示範資料，不影響正式名單、不會發送LINE</div>
<div id="app"></div>
<script>
(function () {
  var NET = [];
  function blocked(kind) {
    return function () {
      NET.push(kind);
      var el = document.getElementById('netCount');
      if (el) el.textContent = String(NET.length);
      throw new Error('隔離測試版已封鎖對外連線');
    };
  }
  try { window.fetch = blocked('fetch'); } catch (e) {}
  try { window.WebSocket = blocked('WebSocket'); } catch (e2) {}
  try { window.EventSource = blocked('EventSource'); } catch (e3) {}
  try { window.XMLHttpRequest = blocked('XMLHttpRequest'); } catch (e4) {}
  try { if (navigator.sendBeacon) navigator.sendBeacon = blocked('sendBeacon'); } catch (e5) {}

  var KEY = 'cc-sandbox-v1';
  var CYCLE = { A: 7, B: 30, C: 14, D: 30 };
  var TABS = [['A 優先','A','tA'],['B 穩定','B','tB'],['C 近期斷線','C','tC'],['D 全年未出席','D','tD'],['待核實','P','tP']];
  var METHODS = ['見面','電話','LINE','其他'];
  var STATUSES = ['順利聯繫','未聯繫上','有需要代禱','願意來聚會'];
  var GROUPS = ['示範群組一','示範群組二','示範群組三'];
  var READONLY_MSG = '觀察者模式不能認領或填寫回訪。這是沙盒資料層拒絕，不是 LINE 登入，也不是正式後端權限驗證。';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function taipeiToday(d) {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
    } catch (e) {
      var x = d || new Date();
      return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
    }
  }
  function addDays(iso, n) {
    var p = String(iso).split('-');
    var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function weekdayName(iso) {
    var p = iso.split('-');
    var n = Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
    return ['日','一','二','三','四','五','六'][(n + 4) % 7];
  }
  function nextRun(iso) {
    var p = iso.split('-');
    var n = Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
    for (var i = 1; i <= 7; i++) {
      var w = ['日','一','二','三','四','五','六'][(n + i + 4) % 7];
      if (w === '一' || w === '四' || w === '六') return addDays(iso, i);
    }
    return addDays(iso, 1);
  }

  var memory = null;
  var persistKind = 'memory';
  function probeStore() {
    try {
      localStorage.setItem(KEY + ':probe', '1');
      localStorage.removeItem(KEY + ':probe');
      persistKind = 'local';
    } catch (e) { persistKind = 'memory'; }
  }
  function saveState(s) {
    memory = s;
    if (persistKind === 'local') {
      try { localStorage.setItem(KEY, JSON.stringify(s)); }
      catch (e) { persistKind = 'memory'; }
    }
  }
  function loadState() {
    probeStore();
    if (persistKind === 'local') {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.v === 1 && parsed.people && parsed.visits) return parsed;
        }
      } catch (e2) {}
    }
    return memory && memory.v === 1 ? memory : null;
  }
  function clearStore() {
    memory = null;
    try { localStorage.removeItem(KEY); } catch (e) {}
  }

  function makePerson(id, tier, tab, district, att, absent, status, by) {
    var n = id.charCodeAt(0) + id.length;
    return {
      id: id, name: '示範對象' + id, tier: tier, tab: tab, district: district,
      group: GROUPS[n % GROUPS.length], att: att, absent: absent,
      attendanceStatus: status, by: by || ''
    };
  }
  function makeSeed() {
    var today = taipeiToday();
    var people = [];
    var spec = [
      ['A', 'A 優先', '2-4', 28, 6, 'verified', 10],
      ['B', 'B 穩定', '2-4', 40, 1, 'verified', 8],
      ['C', 'C 近期斷線', '2-4', 3, 18, 'verified', 8],
      ['D', 'D 全年未出席', '2-4', 0, 43, 'verified', 8]
    ];
    spec.forEach(function (s) {
      for (var i = 1; i <= s[6]; i++) {
        var id = s[0] + (i < 10 ? '0' : '') + i;
        people.push(makePerson(id, s[0], s[1], s[2], s[3], s[4], s[5], ''));
      }
    });
    for (var a = 1; a <= 4; a++) people.push(makePerson('26-0' + a, '待核實', '待核實', '2-6', 0, 43, 'pending', ''));
    for (var b = 1; b <= 3; b++) people.push(makePerson('27-0' + b, '待核實', '待核實', '2-7', 0, 43, 'pending', ''));
    function give(id, who) { people.forEach(function (p) { if (p.id === id) p.by = who; }); }
    ['A01','A02','A06','B01','B02','B03','C01','C02','C03','D01','D02','D03'].forEach(function (id) { give(id, '示範服事者甲'); });
    give('A03', '示範服事者乙');
    give('A04', '示範服事者丙');
    give('A05', '示範服事者丙');
    return {
      v: 1,
      role: '示範服事者甲',
      people: people,
      visits: [{
        id: 'seed-1', personId: 'A01', saint: '示範服事者甲', date: addDays(today, -8),
        method: '電話', status: '順利聯繫', note: '示範備註：這是虛構近況'
      }],
      occupied: { saint: '示範服事者丙', displayName: '示範占用顯示名', active: true }
    };
  }

  var state = loadState() || makeSeed();
  saveState(state);
  var ui = {
    mode: 'claim', tab: 'A 優先', q: '', district: '', pick: {}, drop: {},
    form: null, sampleKind: 'group', short: false, draw: null, repairName: '',
    repairArmed: false, toast: '', toastBad: false
  };

  function findPerson(id) {
    for (var i = 0; i < state.people.length; i++) if (state.people[i].id === id) return state.people[i];
    return null;
  }
  function isObserver() { return state.role === 'observer'; }
  function writerError() { return isObserver() ? READONLY_MSG : ''; }
  function visitsOf(id) {
    return state.visits.filter(function (v) { return v.personId === id; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }
  function statusOf(p) {
    var today = taipeiToday();
    if (p.attendanceStatus === 'pending' || p.tier === '待核實') {
      var histP = visitsOf(p.id);
      return { pending: true, remind: false, cycle: null, last: histP[0] || null, due: '', overdue: -9999, never: !histP.length, history: histP.slice(0, 5) };
    }
    var hist = visitsOf(p.id);
    var cycle = CYCLE[p.tier];
    var last = hist[0] || null;
    var due = last ? addDays(last.date, cycle) : today;
    return { pending: false, remind: true, cycle: cycle, last: last, due: due, overdue: dayDiff(today, due), never: !last, history: hist.slice(0, 5) };
  }
  function dayDiff(today, due) {
    var a = Date.UTC(+today.slice(0, 4), +today.slice(5, 7) - 1, +today.slice(8, 10));
    var b = Date.UTC(+due.slice(0, 4), +due.slice(5, 7) - 1, +due.slice(8, 10));
    return Math.round((a - b) / 86400000);
  }
  function eligiblePersonal(p, who) {
    if (p.by !== who || p.attendanceStatus === 'pending' || p.tier === '待核實') return false;
    var st = statusOf(p);
    if (!st.remind) return false;
    var today = taipeiToday();
    if (st.never || st.due <= today) return true;
    return st.due < nextRun(today);
  }
  function poolsFrom(list) {
    var pools = { A: [], B: [], CD: [] };
    list.forEach(function (p) {
      if (!p || p.attendanceStatus === 'pending' || p.tier === '待核實' || p.tab === '待核實') return;
      if (p.tier === 'A') pools.A.push(p);
      else if (p.tier === 'B') pools.B.push(p);
      else if (p.tier === 'C' || p.tier === 'D') pools.CD.push(p);
    });
    return pools;
  }
  function drawSample(pools, rng) {
    function take(list, n) {
      var copy = list.slice(), out = [], k = Math.min(n, copy.length);
      for (var i = 0; i < k; i++) {
        var idx = Math.floor(rng() * copy.length);
        if (idx >= copy.length) idx = copy.length - 1;
        if (idx < 0) idx = 0;
        out.push(copy.splice(idx, 1)[0]);
      }
      return out;
    }
    var drawn = { A: take(pools.A || [], 2), B: take(pools.B || [], 2), CD: take(pools.CD || [], 4) };
    drawn.list = drawn.A.concat(drawn.B, drawn.CD);
    drawn.pool = { A: (pools.A || []).length, B: (pools.B || []).length, CD: (pools.CD || []).length };
    return drawn;
  }
  function sourceList() {
    if (ui.sampleKind === 'personal') {
      if (isObserver()) return [];
      return state.people.filter(function (p) { return eligiblePersonal(p, state.role); });
    }
    return state.people.filter(function (p) { return !p.by; });
  }
  function activePools() {
    var pools = poolsFrom(sourceList());
    if (!ui.short) return pools;
    return { A: pools.A.slice(0, 1), B: [], CD: pools.CD.slice(0, 1) };
  }
  function resample() {
    var pools = activePools();
    var prev = ui.draw ? ui.draw.list.map(function (p) { return p.id; }).join() : '';
    var drawn = drawSample(pools, Math.random);
    var guard = 0;
    while (prev && drawn.list.map(function (p) { return p.id; }).join() === prev && guard < 6) {
      var richer = (pools.A.length + pools.B.length + pools.CD.length) > drawn.list.length;
      if (!richer) break;
      drawn = drawSample(pools, Math.random);
      guard++;
    }
    ui.draw = drawn;
  }
  function uniqueOk(list) {
    var s = {};
    for (var i = 0; i < list.length; i++) {
      if (s[list[i].id]) return false;
      s[list[i].id] = 1;
    }
    return true;
  }

  function applyClaims() {
    var err = writerError();
    if (err) return { ok: false, error: err };
    var claimed = 0, released = 0, skipped = [];
    Object.keys(ui.drop).forEach(function (id) {
      var p = findPerson(id);
      if (p && p.by === state.role) { p.by = ''; released++; }
    });
    Object.keys(ui.pick).forEach(function (id) {
      var p = findPerson(id);
      if (!p) return;
      if (p.by && p.by !== state.role) { skipped.push(p.name + ' 已被 ' + p.by + ' 認領'); return; }
      if (!p.by) { p.by = state.role; claimed++; }
    });
    ui.pick = {}; ui.drop = {};
    saveState(state);
    return { ok: true, claimed: claimed, released: released, skipped: skipped };
  }
  function saveVisit(personId, date, method, status, note) {
    var err = writerError();
    if (err) return { ok: false, error: err };
    var p = findPerson(personId);
    if (!p) return { ok: false, error: '找不到這位示範對象' };
    if (p.by !== state.role) return { ok: false, error: '這位不是你認領的，沙盒拒絕寫入' };
    var today = taipeiToday();
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return { ok: false, error: '請選擇回訪日期' };
    if (date > today) return { ok: false, error: '回訪日期不能是未來' };
    if (METHODS.indexOf(method) < 0) return { ok: false, error: '請選擇回訪方式' };
    if (STATUSES.indexOf(status) < 0) return { ok: false, error: '請選擇狀況' };
    note = String(note || '').replace(/[\r\n\t]+/g, ' ').trim().slice(0, 200);
    state.visits.push({ id: 'v' + Date.now(), personId: personId, saint: state.role, date: date, method: method, status: status, note: note });
    saveState(state);
    return { ok: true };
  }
  function repairDryRun() {
    var occ = state.occupied;
    var claims = state.people.filter(function (p) { return p.by === occ.saint; });
    var visitCount = state.visits.filter(function (v) { return v.saint === occ.saint; }).length;
    return {
      ok: true, dryRun: true, wrote: false,
      saint: occ.saint, displayName: occ.active ? occ.displayName : '',
      active: occ.active, claimCount: claims.length, claims: claims.map(function (p) { return p.name; }),
      visitCount: visitCount
    };
  }
  function repairConfirm(typed) {
    var before = repairDryRun();
    if (!state.occupied.active) return { ok: false, wrote: false, error: '沙盒裡這位目前沒有被占用', report: before };
    if (String(typed || '') !== state.occupied.displayName) return { ok: false, wrote: false, error: '顯示名稱不符，未修改任何沙盒資料', report: before };
    state.occupied.active = false;
    saveState(state);
    var afterClaims = state.people.filter(function (p) { return p.by === state.occupied.saint; }).map(function (p) { return p.name; });
    return { ok: true, wrote: true, dryRun: false, claimsPreserved: true, claims: afterClaims, claimCount: afterClaims.length };
  }

  function myPeople() {
    return state.people.filter(function (p) { return p.by === state.role; }).map(function (p) {
      var st = statusOf(p);
      p._st = st;
      return p;
    }).sort(function (a, b) { return b._st.overdue - a._st.overdue || (a.name < b.name ? -1 : 1); });
  }
  function visible() {
    return state.people.filter(function (p) {
      if (p.tab !== ui.tab) return false;
      if ((ui.tab === 'D 全年未出席' || ui.tab === '待核實') && ui.q && p.name.indexOf(ui.q) < 0) return false;
      if (ui.tab === '待核實' && ui.district && p.district !== ui.district) return false;
      return true;
    });
  }
  function myCount() {
    var n = 0;
    state.people.forEach(function (p) { if (p.by === state.role && !ui.drop[p.id]) n++; });
    return n + Object.keys(ui.pick).length;
  }
  function mark(t) { return t === '待核實' ? '待' : t; }
  function color(t) { return t === '待核實' ? 'P' : (t || 'D'); }
  function meta(p) {
    var dist = p.district + '・' + p.group + '・';
    if (p.attendanceStatus === 'pending') return dist + '出席狀態待核實（可認領，不列入 C/D 抽樣）';
    return dist + '出席 ' + p.att + '/43・連續缺席 ' + p.absent + ' 週';
  }
  function md(iso) { return iso ? (+iso.slice(5, 7)) + '/' + (+iso.slice(8, 10)) : ''; }

  function toast(msg, bad) { ui.toast = msg; ui.toastBad = !!bad; render(); }
  function render() {
    var app = document.getElementById('app');
    var focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = page();
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) {
        el.focus();
        try { if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
      }
    }
  }
  function page() {
    var who = isObserver() ? '觀察者（唯讀）' : esc(state.role);
    var storeText = persistKind === 'local'

  document.body.addEventListener('click', function (e) {

      var res = applyClaims();
      if (!res.ok) { toast(res.error, true); return; }
      var msg = '已認領 ' + res.claimed + ' 位' + (res.released ? '，取消 ' + res.released + ' 位' : '');

      var deniedV = saveVisit('A01', taipeiToday(), '電話', '順利聯繫', '不該寫入');

      return;

      if (writerError()) { toast(READONLY_MSG, true); return; }
      ui.form = { personId: t.getAttribute('data-id'), date: taipeiToday(), method: '', status: '', note: '' };
      render();
      return;
    }
    if (act === 'close-form') { ui.form = null; render(); return; }
